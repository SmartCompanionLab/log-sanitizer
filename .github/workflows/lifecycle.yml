name: Release Lifecycle Check

# on:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]
#   workflow_dispatch:

# It can be called by the future release pipeline.
# You can still run it manually from GitHub Actions.
# It will not automatically run on every commit/PR.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Release lifecycle check
        shell: pwsh
        run: ./release-data/scripts/check-lifecycle.ps1

      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-lifecycle-report
          path: target/release-lifecycle-report.csv