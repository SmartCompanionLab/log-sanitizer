name: SOUP Lifecycle Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lifecycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run SOUP lifecycle check
        shell: pwsh
        run: ./soup/scripts/check-lifecycle.ps1

      - name: Upload lifecycle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soup-lifecycle-report
          path: target/soup-lifecycle-report.csv