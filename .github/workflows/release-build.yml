name: Release Build Verification

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn clean verify "-Dgpg.skip=true"

      - name: Create build evidence
        if: always()
        run: |
          {
            echo "Release Build and Test Verification"
            echo "=================================="
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Result: ${{ job.status }}"
          } > build-result.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: build-result.txt