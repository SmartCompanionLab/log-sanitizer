name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    uses: ./.github/workflows/sbom.yml

  codeql:
    uses: ./.github/workflows/codeql.yml

  lifecycle:
    uses: ./.github/workflows/lifecycle.yml

  license:
    uses: ./.github/workflows/license-check.yml

  performance:
    uses: ./.github/workflows/performance.yml

  reliability:
    uses: ./.github/workflows/reliability.yml

  release-gate:
    needs:
      - sbom
      - codeql
      - lifecycle
      - license
      - performance
      - reliability

    runs-on: ubuntu-latest

    steps:
      - name: Release gate
        run: |
          echo "All release verification stages passed."
          echo "Release gate PASSED."