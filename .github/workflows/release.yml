name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sbom:
    uses: ./.github/workflows/sbom.yml

  codeql:
    uses: ./.github/workflows/codeql.yml

  lifecycle:
    uses: ./.github/workflows/lifecycle.yml

  license:
    uses: ./.github/workflows/license-check.yml

  performance:
    uses: ./.github/workflows/performance.yml

  reliability:
    uses: ./.github/workflows/reliability.yml

  # Release Gate
  release-gate:
    needs:
      - sbom
      - codeql
      - lifecycle
      - license
      - performance
      - reliability

    runs-on: ubuntu-latest

    steps:
      - name: Release gate
        run: |
          echo "All release verification stages passed."
          echo "Release gate PASSED."

 # Release Evidence
  evidence:
    if: always()
    needs:
      - sbom
      - codeql
      - lifecycle
      - license
      - performance
      - reliability

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release evidence folder
        run: mkdir -p release-evidence

      - name: Capture Git commit
        run: git rev-parse HEAD > release-evidence/git-commit.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/