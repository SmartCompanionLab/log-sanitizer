name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  sbom:
    uses: ./.github/workflows/sbom.yml

  codeql:
    uses: ./.github/workflows/codeql.yml

  lifecycle:
    uses: ./.github/workflows/lifecycle.yml

  license:
    uses: ./.github/workflows/license-check.yml

  performance:
    uses: ./.github/workflows/performance.yml

  reliability:
    uses: ./.github/workflows/reliability.yml

  # Release Gate
  release-gate:
    needs:
      - build
      - sbom
      - codeql
      - lifecycle
      - license
      - performance
      - reliability

    runs-on: ubuntu-latest

    steps:
      - name: Release gate
        run: |
          echo "All release verification stages passed."
          echo "Release gate PASSED."

 # Release Evidence
  evidence:
    if: always()
    needs:
      - build
      - sbom
      - codeql
      - lifecycle
      - license
      - performance
      - reliability

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence folders
        run: |
          mkdir -p release-evidence/sbom
          mkdir -p release-evidence/lifecycle
          mkdir -p release-evidence/license
          mkdir -p release-evidence/performance
          mkdir -p release-evidence/reliability

      - name: Capture Git commit
        run: git rev-parse HEAD > release-evidence/git-commit.txt

      - name: Create release manifest
        run: |
          cat > release-evidence/manifest.txt <<EOF
          Release Evidence Package
          ========================
          Git Commit: $(cat release-evidence/git-commit.txt)
          Repository: $GITHUB_REPOSITORY
          Workflow Run: $GITHUB_RUN_ID

          Evidence:
          - SBOM
          - Lifecycle
          - License
          - Performance
          - Reliability
          EOF

      - name: Download build evidence
        uses: actions/download-artifact@v4
        with:
          name: release-build
          path: release-evidence/build
        continue-on-error: true

      - name: Download SBOM evidence
        uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: release-evidence/sbom
        continue-on-error: true

      - name: Download lifecycle evidence
        uses: actions/download-artifact@v4
        with:
          name: release-lifecycle
          path: release-evidence/lifecycle
        continue-on-error: true

      - name: Download license evidence
        uses: actions/download-artifact@v4
        with:
          name: release-license
          path: release-evidence/license
        continue-on-error: true

      - name: Download performance evidence
        uses: actions/download-artifact@v4
        with:
          name: release-performance
          path: release-evidence/performance
        continue-on-error: true

      - name: Download reliability evidence
        uses: actions/download-artifact@v4
        with:
          name: release-reliability
          path: release-evidence/reliability
        continue-on-error: true

      - name: Create release summary
        env:
          SBOM_RESULT: ${{ needs.sbom.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          LIFECYCLE_RESULT: ${{ needs.lifecycle.result }}
          LICENSE_RESULT: ${{ needs.license.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
          RELIABILITY_RESULT: ${{ needs.reliability.result }}
        run: |
          if [ "$SBOM_RESULT" = "success" ] && \
             [ "$CODEQL_RESULT" = "success" ] && \
             [ "$LIFECYCLE_RESULT" = "success" ] && \
             [ "$LICENSE_RESULT" = "success" ] && \
             [ "$PERFORMANCE_RESULT" = "success" ] && \
             [ "$RELIABILITY_RESULT" = "success" ]; then
            OVERALL_RESULT="PASS"
          else
            OVERALL_RESULT="FAIL"
          fi

          {
            echo "Release Verification Summary"
            echo "============================"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $(cat release-evidence/git-commit.txt)"
            echo ""
            echo "Verification Results"
            echo "--------------------"
            echo "SBOM: $SBOM_RESULT"
            echo "CodeQL: $CODEQL_RESULT"
            echo "Lifecycle: $LIFECYCLE_RESULT"
            echo "License: $LICENSE_RESULT"
            echo "Performance: $PERFORMANCE_RESULT"
            echo "Reliability: $RELIABILITY_RESULT"
            echo ""
            echo "Overall Release Result: $OVERALL_RESULT"
            echo ""
            echo "Evidence Files"
            echo "--------------"
            find release-evidence -type f | sort
          } > release-evidence/release-summary.txt

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/