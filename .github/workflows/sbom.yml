name: Generate SBOM

# on:
#   push:
#     branches:
#       - main
#   workflow_dispatch:

# It can be called by the future release pipeline.
# You can still run it manually from GitHub Actions.
# It will not automatically run on every commit/PR.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  sbom:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Prepare SBOM POM
        run: |
          cp pom.xml pom-sbom.xml
          sed -i 's/<extensions>true<\/extensions>/<extensions>false<\/extensions>/' pom-sbom.xml

      - name: Generate SBOM
        run: mvn -f pom-sbom.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: target/bom.*